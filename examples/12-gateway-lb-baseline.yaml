# 데모 12. 게이트웨이·로드밸런서 기본 구성
#
# 흔한 운영 구성: 인터넷 → L7 로드밸런서(ALB) → API 게이트웨이(Spring Cloud Gateway) → 서비스들 → DB·Redis.
# 평소 트래픽에서는 건강하다. 점심 이벤트로 트래픽이 5배(600 → 3,000 RPS)가 되면 게이트웨이 CPU가 먼저 포화되어 모든 API가 함께 느려진다.
# 이 파일은 자기 구성에 맞게 고쳐 쓰는 출발점으로도 쓸 수 있다.

demo:
  id: gateway-lb-baseline
  title: 게이트웨이·LB 기본 구성
  break: 평소엔 건강하지만 트래픽이 5배(600 → 3,000 RPS)가 되면 게이트웨이 CPU가 먼저 포화되어 뒤의 서비스가 멀쩡해도 모든 API가 느려집니다.
  focus: gateway

topology: { zones: [a, b, c], crossZoneRtt: 1ms, zoneAware: true }

nodes:
  alb:
    kind: loadbalancer
    target: gateway
    layer: 7
    algorithm: least-conn
    healthCheck: { interval: 5s, threshold: 2 }
    timeout: 60s
    instances: 3          # 존마다 하나 (zone-aware 라우팅)
  gateway:
    kind: gateway
    instances: 2
    os: { vcpu: 2, heap: 1g, gc: g1 }
    cpu: 2ms
    routes:
      "/products/**": { to: product, timeout: 1s, rateLimit: 4000rps }
      "/orders/**": { to: order, timeout: 3s }
      "/users/**": { to: user, timeout: 1s }
  product:
    instances: 3
    healthCheck: { interval: 5s, threshold: 2 }
    endpoints:
      GET /products/{id}:
        selfTime: { p50: 3ms, p99: 12ms }
        calls:
          - { call: "redis:GET product", onMiss: [ "catalog-db:selectProduct" ] }
      GET /products/search:
        selfTime: { p50: 8ms, p99: 40ms }
        calls: [ "catalog-db:searchProducts" ]
  order:
    instances: 3
    healthCheck: { interval: 5s, threshold: 2 }
    endpoints:
      POST /orders:
        selfTime: { p50: 6ms, p99: 25ms }
        calls: [ "user:GET /users/{id}", "order-db:insertOrder" ]
      GET /orders/{id}:
        selfTime: { p50: 3ms, p99: 12ms }
        calls: [ "order-db:selectOrder" ]
  user:
    instances: 2
    healthCheck: { interval: 5s, threshold: 2 }
    endpoints:
      GET /users/{id}:
        selfTime: { p50: 2ms, p99: 8ms }
        calls: [ "redis:GET user" ]
  redis:
    kind: cache
    cluster: { shards: 3, replicas: 1 }
    ops:
      GET product: { hitRate: 95% }
      GET user: { hitRate: 99% }
  catalog-db:
    kind: db
    cluster: { replicas: 2, readSplit: true }
    queries:
      selectProduct: { p50: 2ms, p99: 8ms }
      searchProducts: { p50: 12ms, p99: 60ms }
  order-db:
    kind: db
    cluster: { replicas: 1 }
    queries:
      insertOrder: { p50: 4ms, p99: 15ms }
      selectOrder: { p50: 1ms, p99: 5ms }

edges:
  client->alb: { network: { rtt: 20ms, jitter: 3ms } }
  order->user: { timeout: 500ms }
  order->order-db: { pool: { size: 20, timeout: 2s } }

scenario:
  duration: 80s
  warmup: 5s
  seed: 12
  clientTimeout: 10s
  traffic:
    type: spike
    base: 600rps
    peak: 3000rps
    at: 40s
    hold: 30s
    rampUp: 5s
    mix: { "GET /products/{id}": 60%, "GET /products/search": 10%, "POST /orders": 10%, "GET /orders/{id}": 10%, "GET /users/{id}": 10% }
  slo:
    p99: 150ms
    errorRate: 0.1%
    endpoints:
      POST /orders: { p99: 300ms }

layout:
  alb: [40, 220]
  gateway: [300, 220]
  product: [580, 40]
  order: [580, 240]
  user: [580, 440]
  redis: [880, 120]
  catalog-db: [880, 0]
  order-db: [880, 300]
