spring:
  application:
    name: payment
  datasource:
    url: jdbc:mysql://toxiproxy:23306/payments?useSSL=false&allowPublicKeyRetrieval=true
    username: app
    password: app
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
  rabbitmq:
    host: rabbitmq
    listener:
      simple:
        concurrency: 2
        prefetch: 10
        acknowledge-mode: auto
  kafka:
    bootstrap-servers: kafka:9092
    listener:
      concurrency: 3
    consumer:
      auto-offset-reset: earliest
      max-poll-records: 500
server:
  port: 8081
  tomcat:
    threads:
      max: 50
app:
  rabbit:
    enabled: true
  kafka:
    enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
